name: Tests

on:
  pull_request:
    branches: ["**"]

jobs:
  linux-tests:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            linux:
              - 'linux/**'
              - 'third_party/**'

      - uses: actions/setup-python@v7
        if: steps.changes.outputs.linux == 'true'
        with:
          python-version: "3.14"

      - name: Install test dependencies
        if: steps.changes.outputs.linux == 'true'
        run: pip install pytest

      # Without a loadable libraproxy_rchash the hashing tests skip themselves,
      # so the suite would stay green while every ROM format goes untested.
      - name: Build native hasher
        if: steps.changes.outputs.linux == 'true'
        run: TARGET=host OUT_DIR="${{ runner.temp }}/rchash" bash linux/build_rchash.sh

      - name: Run linux tests
        if: steps.changes.outputs.linux == 'true'
        env:
          RAOFFLINEPROXY_RCHASH_LIB: ${{ runner.temp }}/rchash/libraproxy_rchash.so
        run: python3 -m pytest linux/tests/

  android-tests:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            android:
              - 'app/**'
              - 'third_party/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
              - 'gradlew'

      - uses: actions/setup-java@v5
        if: steps.changes.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.3.0
        if: steps.changes.outputs.android == 'true'

      - name: Install NDK
        if: steps.changes.outputs.android == 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.0.13004108" "cmake;3.22.1"

      - name: Run android unit tests
        if: steps.changes.outputs.android == 'true'
        run: ./gradlew testDebugUnitTest
