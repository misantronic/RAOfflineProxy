name: Tests

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  # Both linux jobs gate on this, so the definition of "a linux change" lives in
  # one place. Pull requests only: the other events run everything unconditionally.
  changes:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.filter.outputs.linux }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            linux:
              - 'linux/**'
              - 'third_party/**'
              - '.github/workflows/tests.yml'

  linux-tests:
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    steps:
      # rcheevos and libchdr are submodules; the native hasher is built from them.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: pip install pytest

      # Without a loadable libraproxy_rchash the hashing tests skip themselves,
      # so the suite would stay green while every ROM format goes untested.
      - name: Build native hasher
        run: TARGET=host OUT_DIR="${{ runner.temp }}/rchash" bash linux/build_rchash.sh

      - name: Run linux tests
        env:
          RAOFFLINEPROXY_RCHASH_LIB: ${{ runner.temp }}/rchash/libraproxy_rchash.so
        run: python3 -m pytest linux/tests/

  android-tests:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            android:
              - 'app/**'
              - 'third_party/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
              - 'gradlew'

      - uses: actions/setup-java@v6
        if: steps.changes.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.3.0
        if: steps.changes.outputs.android == 'true'

      - name: Install NDK
        if: steps.changes.outputs.android == 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.0.13004108" "cmake;3.22.1"

      - name: Run android unit tests
        if: steps.changes.outputs.android == 'true'
        run: ./gradlew testDebugUnitTest

  # Container E2E: installs the real device bundle into a device-shaped rootfs
  # on the target architecture and drives a full lifecycle against the fake RA
  # server. See linux/tests/e2e/README.md.
  #
  # Every architecture is emulated on the x86_64 runners, so this is far slower
  # than the unit suites. It runs on any pull request that touches linux/ — the
  # "e2e" label forces it on a PR that does not — and on demand.
  #
  # !cancelled() is what lets a workflow_dispatch run through: "changes" is
  # skipped there, and a skipped dependency would otherwise skip this job whatever
  # the condition below says.
  linux-e2e:
    name: e2e (${{ matrix.device }})
    needs: changes
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.outputs.linux == 'true' ||
        contains(github.event.pull_request.labels.*.name, 'e2e')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        device: [knulli, rocknix, muos, onion, spruce, allium, darkos]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: pip install pytest

      # binfmt handlers so the aarch64 device images can run here.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,arm

      # build_rchash.sh cross-compiles the native hasher with zig; without
      # ZIG_BIN it looks for a Homebrew path that does not exist on the runner.
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      # Onion, spruce and Allium resize their launcher icon at build time;
      # resize_icon.sh falls back to ImageMagick when sips is absent.
      - name: Install image tooling
        if: matrix.device == 'onion' || matrix.device == 'spruce' || matrix.device == 'allium'
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      # Keyed on the fetch script, which is where the asset versions are
      # pinned, so bumping a version invalidates the cache on its own.
      - name: Cache vendored pygame
        if: matrix.device == 'rocknix' || matrix.device == 'muos'
        id: vendor-cache
        uses: actions/cache@v6
        with:
          path: linux/${{ matrix.device }}/vendor
          key: ${{ matrix.device }}-vendor-${{ hashFiles(format('linux/{0}/fetch_vendor.sh', matrix.device)) }}

      # fetch_vendor.sh has no "already present" guard, so a cache hit has to
      # skip the step rather than rely on the script no-opping.
      - name: Fetch vendored pygame
        if: >-
          (matrix.device == 'rocknix' || matrix.device == 'muos') &&
          steps.vendor-cache.outputs.cache-hit != 'true'
        run: bash linux/${{ matrix.device }}/fetch_vendor.sh

      # spruce and Allium reuse Onion's armv7 CPython and pygame, so all three
      # share one cache entry.
      - name: Cache Onion runtime and pygame
        if: matrix.device == 'onion' || matrix.device == 'spruce' || matrix.device == 'allium'
        id: onion-cache
        uses: actions/cache@v6
        with:
          path: |
            linux/onion/runtime-cache
            linux/onion/vendor
          key: onion-runtime-${{ hashFiles('linux/onion/fetch_runtime.sh', 'linux/onion/fetch_vendor.sh') }}

      - name: Fetch Onion runtime and pygame
        if: >-
          (matrix.device == 'onion' || matrix.device == 'spruce' || matrix.device == 'allium') &&
          steps.onion-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash linux/onion/fetch_runtime.sh
          bash linux/onion/fetch_vendor.sh

      - name: Run ${{ matrix.device }} E2E scenarios
        env:
          ZIG_BIN: zig
        run: python3 -m pytest linux/tests/e2e -q --e2e-device ${{ matrix.device }}
